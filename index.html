<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description"
        content="Professional 4-screen fireworks screensaver with multiple themes and intensity controls">
    <link rel="manifest" href="manifest.json">
    <title>Midas Fireworks Screensaver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 20px 30px;
            font-size: 14px;
            z-index: 100;
            transition: opacity 0.5s;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #overlay h1 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        #overlay p {
            margin: 3px 0;
            opacity: 0.9;
        }

        #overlay .controls {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div id="overlay">
        <h1>🎆 Midas Fireworks Screensaver</h1>
        <p id="themeText">Theme: Classic</p>
        <p id="intensityText">Intensity: 80 particles</p>
        <p id="soundText">Sound: ON</p>
        <div class="controls">
            🎨 Arrow Keys: Change theme & intensity | 🔇 M: Toggle sound | ⚙️ H: Toggle this help | ESC: Exit fullscreen
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');

        let width, height;
        let particles = [];
        let gravity = 0.15;
        let burstIntensity = 80;
        const minBurstIntensity = 20;
        const maxBurstIntensity = 200;

        // Color themes
        const themes = [
            { name: 'Classic', colors: ['#FF0000', '#FFFF00', '#FFFFFF'] },
            { name: 'Neon', colors: ['#FF00FF', '#00FFFF', '#FF80FF'] },
            { name: 'Green/Cyan', colors: ['#00FF00', '#00FFFF', '#80FF80'] },
            { name: 'Gold', colors: ['#FFA500', '#FFD700', '#FFFFFF'] }
        ];
        let themeIndex = 0;

        // Settings
        let showOverlay = true;
        let soundOn = true;
        let lastInputTime = Date.now();
        let audioCtx = null;

        // Initialize
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio initialization
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Sound effects
        function playBoom() {
            if (!soundOn || !audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
                }
                const noise = audioCtx.createBufferSource();
                const gain = audioCtx.createGain();
                noise.buffer = buffer;
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                noise.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } catch (e) { }
        }

        // Get random color from current theme
        function getRandomThemeColor() {
            const theme = themes[themeIndex];
            return theme.colors[Math.floor(Math.random() * theme.colors.length)];
        }

        // Spawn firework burst
        function spawnFireworkBurst() {
            const px = Math.random() * width;
            const py = Math.random() * (height * 0.4) + (height * 0.1);

            for (let i = 0; i < burstIntensity; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;

                particles.push({
                    x: px,
                    y: py,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: Math.random() * 30 + 30,
                    color: getRandomThemeColor()
                });
            }

            playBoom();
        }

        // Update particles
        function updateFireworks() {
            // Occasionally spawn new burst (2% chance per frame)
            if (Math.random() < 0.02) {
                spawnFireworkBurst();
            }

            // Update all particles
            particles = particles.filter(p => {
                p.vy += gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                // Keep particles that are alive and on screen
                return p.life > 0 && p.y < height + 50 && p.y > -50 && p.x > -50 && p.x < width + 50;
            });
        }

        // Render fireworks
        function renderFireworks() {
            // Clear to black
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Draw particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                const alpha = Math.min(p.life / 60, 1);
                ctx.globalAlpha = alpha;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 3, 3);
            });
            ctx.globalAlpha = 1;
        }

        // Update UI overlay
        function updateOverlayText() {
            document.getElementById('themeText').textContent = `Theme: ${themes[themeIndex].name}`;
            document.getElementById('intensityText').textContent = `Intensity: ${burstIntensity} particles`;
            document.getElementById('soundText').textContent = `Sound: ${soundOn ? 'ON' : 'OFF'}`;
        }

        // Keyboard controls
        document.addEventListener('keydown', e => {
            lastInputTime = Date.now();
            showOverlay = true;
            overlay.classList.remove('hidden');

            // Initialize audio on first interaction
            if (!audioCtx) initAudio();

            switch (e.key) {
                case 'ArrowUp': // Next theme
                    themeIndex = (themeIndex + 1) % themes.length;
                    updateOverlayText();
                    break;
                case 'ArrowDown': // Previous theme
                    themeIndex = (themeIndex - 1 + themes.length) % themes.length;
                    updateOverlayText();
                    break;
                case 'ArrowLeft': // Decrease intensity
                    burstIntensity = Math.max(minBurstIntensity, burstIntensity - 10);
                    updateOverlayText();
                    break;
                case 'ArrowRight': // Increase intensity
                    burstIntensity = Math.min(maxBurstIntensity, burstIntensity + 10);
                    updateOverlayText();
                    break;
                case 'm':
                case 'M': // Toggle sound
                    soundOn = !soundOn;
                    updateOverlayText();
                    break;
                case 'h':
                case 'H': // Toggle overlay
                    showOverlay = !showOverlay;
                    overlay.classList.toggle('hidden', !showOverlay);
                    break;
                case 'f':
                case 'F': // Fullscreen
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen();
                    }
                    break;
                case 'Escape': // Exit fullscreen
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                    break;
            }
        });

        // Touch/click to spawn burst
        canvas.addEventListener('click', e => {
            if (!audioCtx) initAudio();
            lastInputTime = Date.now();
            showOverlay = true;
            overlay.classList.remove('hidden');

            // Spawn burst at click location
            const px = e.clientX;
            const py = e.clientY;
            for (let i = 0; i < burstIntensity; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: px,
                    y: py,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: Math.random() * 30 + 30,
                    color: getRandomThemeColor()
                });
            }
            playBoom();
        });

        // Auto-hide overlay after 10 seconds
        setInterval(() => {
            if (showOverlay && Date.now() - lastInputTime > 10000) {
                showOverlay = false;
                overlay.classList.add('hidden');
            }
        }, 1000);

        // Main animation loop
        function animate() {
            updateFireworks();
            renderFireworks();
            requestAnimationFrame(animate);
        }

        // Start
        updateOverlayText();
        animate();

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => {
                console.log('Service Worker registration failed:', err);
            });
        }
    </script>
</body>

</html>
